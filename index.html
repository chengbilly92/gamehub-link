<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>桌遊平台</title>
<style>
  :root { color-scheme: light dark; --bg: #f4f1ea; --fg: #1f2a44; --muted: #5d6577; --accent: #2f6b5e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #12161f; --fg: #e7e9ef; --muted: #a3abbd; --accent: #7cc4b2; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font: 16px/1.6 system-ui, -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; }
  main { padding: 24px 16px; text-align: center; }
  h1 { font-size: 22px; margin: 0 0 8px; color: var(--accent); }
  p { margin: 0; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>桌遊平台</h1>
  <p id="msg">正在前往遊戲網站…</p>
</main>
<script>
// Fixed entry point published by hub-service.sh (scripts/publish-url.mjs): forwards to the current tunnel URL from
// url.json and keeps "#/game/<id>?token=…" (or "#/reset?token=…") as the path there. The part after "#" is never sent
// to GitHub, so seat tokens and reset secrets stay between the browser and the GameHub server. This page is public: it
// holds no art and no secrets.
var rest = location.hash.indexOf('#/') === 0 ? location.hash.slice(1) : '/';
fetch('url.json?t=' + Date.now(), { cache: 'no-store' })
  .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)); })
  .then(function (j) {
    if (!/^https:\/\/[^/]+$/.test(j.url)) throw new Error('bad url');
    location.replace(j.url + rest);
  })
  .catch(function () {
    document.getElementById('msg').textContent = '暫時找不到遊戲網址，請過一分鐘再重新整理。';
  });
</script>
</body>
</html>
